<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Проверка региона</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f0f14;
    color: #f1f1f1;
    padding: 20px;
  }
  .card {
    max-width: 700px;
    width: 100%;
    background: #1c1c22;
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  h1 { margin-top: 0; font-size: 22px; }
  p { line-height: 1.5; color: #c9c9d1; }
  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 14px 34px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #fff;
    background: #ff2d2d;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .btn:hover { background: #e01f1f; transform: translateY(-1px); }
  .btn.secondary {
    background: transparent;
    border: 1px solid #444;
    color: #c9c9d1;
    margin-left: 8px;
  }
  .btn.secondary:hover { background: #2a2a33; }
  .spinner {
    width: 42px; height: 42px;
    margin: 0 auto;
    border: 4px solid #333;
    border-top-color: #ff2d2d;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }

  /* === Плеер === */
  .player {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 */
    height: 0;
    overflow: hidden;
    border-radius: 12px;
    margin-top: 20px;
    background: #000;
  }
  .player iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }

  /* Накладки, скрывающие интерфейс YouTube */
  .cover-top, .cover-bottom {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none; /* клики проходят сквозь них на плеер */
    z-index: 2;
    display: none;
  }
  /* Верхняя панель: заголовок, канал, «Поделиться», шестерёнка */
  .cover-top {
    top: 0;
    height: 75px;
    background: linear-gradient(to bottom, #000 0%, #000 70%, transparent 100%);
  }
  /* Нижняя панель: таймлайн, звук, логотип, «Другие видео» */
  .cover-bottom {
    bottom: 0;
    height: 65px;
    background: linear-gradient(to top, #000 0%, #000 60%, transparent 100%);
  }
  .playing .cover-top,
  .playing .cover-bottom { display: block; }

  /* Превью до запуска */
  .preview {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .preview::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.25);
  }
  .play-btn {
    position: relative;
    z-index: 2;
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(255,45,45,.95);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
    transition: transform .15s ease;
  }
  .preview:hover .play-btn { transform: scale(1.08); }
  .play-btn::before {
    content: "";
    display: block;
    width: 0; height: 0;
    margin-left: 6px;
    border-left: 22px solid #fff;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
  }

  .warn-icon { font-size: 44px; margin-bottom: 8px; }
  .actions { margin-top: 20px; }
</style>
</head>
<body>

<div class="card">

  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top:16px;">Проверяем ваш регион…</p>
  </div>

  <div id="blocked" class="hidden">
    <div class="warn-icon">🚫</div>
    <h1>Сервис недоступен в России</h1>
    <p>Пожалуйста, <b>включите VPN</b> и обновите страницу.<br>Наш сервис не доступен на территории РФ.</p>
    <button class="btn" onclick="location.reload()">ОБНОВИТЬ</button>
  </div>

  <div id="allowed" class="hidden">
    <button class="btn" id="openBtn">ОТКРЫТЬ</button>
  </div>

  <div id="playerWrap" class="hidden">
    <div class="player" id="player">
      <!-- Накладки, скрывающие верх и низ плеера -->
      <div class="cover-top"></div>
      <div class="cover-bottom"></div>

      <!-- Наше превью с кнопкой Play -->
      <div class="preview" id="preview">
        <div class="play-btn"></div>
      </div>

      <iframe
        id="ytFrame"
        src=""
        title="Video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    </div>
    <div class="actions">
      <button class="btn secondary" id="closeBtn">ЗАКРЫТЬ</button>
    </div>
  </div>

</div>

<script>
  const VIDEO_ID = "MC_sxGxu0oY";
  const POSTER   = `https://i.ytimg.com/vi/${VIDEO_ID}/maxresdefault.jpg`;

  // Параметры убирают субтитры, логотип, аннотации, чужие видео
  const VIDEO_URL =
    `https://www.youtube-nocookie.com/embed/${VIDEO_ID}` +
    `?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=0&playsinline=1`;

  const loadingEl  = document.getElementById('loading');
  const blockedEl  = document.getElementById('blocked');
  const allowedEl  = document.getElementById('allowed');
  const playerWrap = document.getElementById('playerWrap');
  const playerEl   = document.getElementById('player');
  const preview    = document.getElementById('preview');
  const ytFrame    = document.getElementById('ytFrame');
  const openBtn    = document.getElementById('openBtn');
  const closeBtn   = document.getElementById('closeBtn');

  preview.style.backgroundImage = `url('${POSTER}')`;

  const show = el => el.classList.remove('hidden');
  const hide = el => el.classList.add('hidden');

  async function checkRegion() {
    try {
      const res = await fetch('https://ipwho.is/', { cache: 'no-store' });
      const data = await res.json();
      const country = (data && data.country_code) ? data.country_code.toUpperCase() : null;

      hide(loadingEl);
      if (country === 'RU') show(blockedEl);
      else show(allowedEl);
    } catch (e) {
      hide(loadingEl);
      show(allowedEl);
    }
  }

  openBtn.addEventListener('click', () => {
    hide(allowedEl);
    show(playerWrap);
  });

  preview.addEventListener('click', () => {
    ytFrame.src = VIDEO_URL;
    preview.style.display = 'none';
    playerEl.classList.add('playing'); // включаем накладки
  });

  closeBtn.addEventListener('click', () => {
    ytFrame.src = '';
    playerEl.classList.remove('playing');
    preview.style.display = 'flex';
    hide(playerWrap);
    show(allowedEl);
  });

  checkRegion();
</script>

</body>
</html>
